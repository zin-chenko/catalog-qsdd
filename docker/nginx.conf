server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A fresh entry point must reference the current hashed Angular bundles.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /mock/ {
        try_files $uri =404;
    }

    # Reserve API paths for a future backend instead of returning SPA HTML.
    location /api/ {
        return 404;
    }

    # Support direct links and refreshes on Angular routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
